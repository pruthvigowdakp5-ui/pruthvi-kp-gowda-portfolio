<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f4">
    <meta name="robots" content="noindex, nofollow">
    <title>Private Inbox — Pruthvi KP Gowda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script type="module" src="inbox.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="navigation page-width" aria-label="Main navigation">
        <a class="wordmark" href="index.html" aria-label="Pruthvi KP Gowda, home">PKPG</a>
        <a class="text-link" href="index.html">Back to portfolio</a>
      </nav>
    </header>

    <main class="inbox-main" id="main">
      <div class="inbox-heading">
        <p class="eyebrow">Private</p>
        <h1>Message inbox</h1>
      </div>
      <section class="inbox-panel" aria-label="Private message inbox">
        <div id="auth-view">
          <h2>Sign in</h2>
          <form class="inbox-auth-form" id="login-form">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="username" required>
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            <button class="button button-dark" type="submit">Sign in</button>
          </form>
        </div>
        <div id="messages-view" hidden>
          <div class="inbox-toolbar">
            <h2>Messages</h2>
            <button class="button button-light" id="sign-out" type="button">Sign out</button>
          </div>
          <div id="message-list" aria-live="polite"></div>
        </div>
        <p class="inbox-status" id="inbox-status" role="status" aria-live="polite">
          Connecting to the private inbox…
        </p>
      </section>
    </main>
  </body>
</html>
